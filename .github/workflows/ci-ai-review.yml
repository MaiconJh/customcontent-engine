name: CI AI Governance Bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write
  actions: read

env:
  CI_AI_WORKER_URL: ${{ vars.CI_AI_WORKER_URL }}
  CI_WORKER_SHARED_SECRET: ${{ secrets.CI_WORKER_SHARED_SECRET }}
  MAX_DIFF_CHARS: "50000"
  MAX_CHARS: "50000"

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run GitHub Actions build/test/integrationTest
        id: build
        run: |
          chmod +x scripts/ci/run-build.sh
          scripts/ci/run-build.sh

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports
          path: |
            build/reports/tests/
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  ai-review:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ always() && needs.build-test.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Collect diff
        run: |
          chmod +x scripts/ci/collect-diff.sh
          scripts/ci/collect-diff.sh

      - name: Collect project documentation context
        run: node scripts/ci/collect-project-context.js --output project-context.json

      - name: Check AI context pack drift
        run: node scripts/ci/check-ai-context-pack-drift.js > ai-context-pack-drift.json

      - name: Analyze diff with Worker
        id: analyze
        continue-on-error: true
        env:
          CI_BUILD_RESULT: ${{ needs.build-test.result }}
        run: |
          node scripts/ci/call-worker.js --type diff --input-file diff.patch --context-file project-context.json --drift-file ai-context-pack-drift.json --output-file ai-response.json --markdown-file ai-response.md --findings-file ai-findings.json

      - name: Extract PR number
        if: github.event_name == 'pull_request'
        run: node -e 'const e=require(process.env.GITHUB_EVENT_PATH); require("fs").appendFileSync(process.env.GITHUB_ENV, "PR_NUMBER=" + e.pull_request.number + "\n")'

      - name: Publish PR review comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_INLINE_COMMENTS: "10"
        run: node scripts/ci/create-or-update-comment.js --marker '<!-- ai-ci-review-bot:summary -->' --body-file ai-response.md --findings-file ai-findings.json

      - name: Publish main push note
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/create-or-update-push-note.js --body-file ai-response.md --labels automated,ai-analysis

  failure-report:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ always() && needs.build-test.result == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Download build log
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-build-log
          path: .

      - name: Sanitize build log
        run: node scripts/ci/sanitize-payload.js --input build.log --output build.sanitized.log --max-chars 50000 --text

      - name: Collect project documentation context
        run: node scripts/ci/collect-project-context.js --output project-context.json

      - name: Check AI context pack drift
        run: node scripts/ci/check-ai-context-pack-drift.js > ai-context-pack-drift.json

      - name: Analyze failure with Worker
        continue-on-error: true
        env:
          CI_BUILD_RESULT: ${{ needs.build-test.result }}
        run: node scripts/ci/call-worker.js --type failure --input-file build.sanitized.log --ci-logs-file build.sanitized.log --context-file project-context.json --drift-file ai-context-pack-drift.json --output-file failure-response.json --markdown-file failure-response.md

      - name: Create or update CI failure issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/create-or-update-issue.js --body-file failure-response.md --labels ci-failure,automated,ai-analysis
