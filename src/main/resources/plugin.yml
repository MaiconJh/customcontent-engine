name: CustomContentEngine
main: com.customcontentengine.bootstrap.CustomContentPlugin
version: 0.1.0-SNAPSHOT
api-version: "1.21"
author: CustomContent Engine
commands:
  givecustomitem:
    description: Debug command to give a custom item.
    usage: /givecustomitem <id>
  debugareabreak:
    description: Internal debug command to execute area_break against the targeted block.
    usage: /debugareabreak
  veinminertoggle:
    description: Toggle the vein_miner mechanic for the calling player.
    usage: /veinminertoggle
  debugregistry:
    description: Dev tool that dumps registered item to mechanic bindings.
    usage: /debugregistry
  debugplace:
    description: Dev tool that places a custom block at a world position.
    usage: /debugplace <blockId> <x> <y> <z> [world]
  debugmine:
    description: Dev tool that starts a custom mining session for integration tests.
    usage: /debugmine <toolId> <x> <y> <z> [world]
  debugquery:
    description: Dev tool that reports the custom-block identity and current material at a position.
    usage: /debugquery <x> <y> <z> [world]
